<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <title>sign up</title>
</head>

<body>

  <form action="/index.html" method="get">
    <div class="login-box">
    <div class="login-header">
       <img src="/1000982650-removebg-preview.png" height="150px">
      <header>Sign up</header>
    </div>
  <div class="input box">
      <input type="Name" class="input-field" placeholder="Full Name"  required>
    </div>
    <div class="input box">
      <input type="email" class="input-field" placeholder="Email"  required>
    </div>
        <div class="input box">
      <input type="Password" class="input-field" id="password1" placeholder="Password"  required>
    </div>
    <div class="input box">
      <input type="confirmed password" class="input-field"
id="password2"placeholder="confirmed Password"  required>
    </div>
     <div class="input-submit">
      <button class="submit-btn" id="submit">
      Sign up</button>
        </div>
    <div class="sign-up-link">
          <p>Already have an account?<a href="/index.html">Login</a></p>
        </div> 
        <div class="result" id="result"></div>
        </form>
          <script src="main.js">
            
          </script>
  
</body>

</html>
